# シーンプロファイル: ボトル pick-and-place・机上・chest 単眼
#                    ★bottle-desk-v1 から「ボトル基準マーカー」だけを外した対照条件
#
# このファイルは「物理配置の宣言」であって、ソフトの挙動は変えない。
# 収集スクリプトは SCENE=bottle-desk-v2 を受け取り、このファイルの sha を
# manifest.json に焼き込むだけ。だから守るルールは1つだけ:
#
#   物理配置を変えたら「新しいファイル」を作る。このファイルの中身は書き換えない。
#
# 書くのは「ソフトが知り得ない物理」だけ。左右の腕・fps・カメラの製造番号・
# 解像度・重力補償値・commit・較正 sha は起動時の設定ダンプに出るので書かない。

name: bottle-desk-v2
created: 2026-08-04
measured: 2026-08-04        # v1 と同一環境で計測（マーカー以外は同じ配置）
task: bottle-pick-and-place
note: "マーカー無し条件の 50ep 用。Kento 単独。v1 と統合しない"

# --- 対になるシーン（マーカー有り/無しの対照実験）-----------------------------
# 2026-08-04 Kento 決定: **まずマーカー有り(v1)で 50ep、次にマーカー無し(v2)で
# 50ep** 録る。目印が方策に効くか（近道学習が起きるか）を議論ではなく実測で決める。
#   bottle-desk-v1 = マーカー有り
#   bottle-desk-v2 = マーカー無し（このファイル）
#
# **v1 と v2 は別データセットとして扱い、統合しない。** 混ぜると比べたい差が消える。
# 逆に、マーカー以外は同じ配置に保つのが対照実験の条件なので、机・照明・ボトル・
# かご・散らし方は v1 と同一の値をそのまま持つ（差分はマーカーの有無1点だけ）。
#
# 【収録順と、統制しないと決めたもの（2026-08-04 Kento 判断）】
# 順序は **v1 を 50ep 全部 → v2 を 50ep 全部**（セッション交互にはしない）。
# これに伴い次の2つは意図的に統制しない。抜けではなく判断としてここに残す。
#   - **操作者の上達**: Kento は既に十分テレオペしてきており、100ep のあいだの
#     学習曲線は平坦とみなす。よって v2 が「より練習した操作者のデータ」になる効果は
#     無視できると判断した。なお台帳に `ep` 順と `retakes` が残るので、**もし上達が
#     効いていればセッションが進むほど retakes が減る形で後から検出できる**（無料で
#     反証可能なので、この仮定を置いても危険が小さい）
#   - **ボトルの凹みの進行**: 同一個体を継続使用（object.condition 参照）
#   - 昼/夜の分布も同様に揃えない（lighting.daylight_controlled: false）
pair:
  compares: "ボトル基準マーカーの有無"
  with: "bottle-desk-v1"
  role: "marker_absent"
  collection_order: "v1 を 50ep 全部 → v2 を 50ep 全部（交互にしない）"

# --- 机（v1 と同一）---------------------------------------------------------
table:
  kind: height_adjustable   # 昇降テーブル
  height_mm: 715            # 床から天板まで(実測)
  # 昇降テーブル自身の表示値。再現するときはこれを合わせる方が実測より速く確実
  # (実測 715mm と表示 72 が一致しないのは、表示が cm 刻みの丸めだから)。
  desk_preset: "72"
  surface: "白。アルミニウム基材に粉体塗装"
  # ロボット基部の定義が曖昧なので、再現できる物理関係で書く:
  # OpenArm を固定するクランプを昇降テーブルの縁に突き当てて固定しており、
  # OpenArm 底板の先端から天板の手前端までがクランプの幅ぶんだけ空く。
  base_to_table_edge_mm: 35
  base_mount: "クランプを昇降テーブルの縁に突き当てて固定(35mm=クランプ幅)"

mat:
  present: false            # 敷かない
  kind: null
  orientation: null

lighting:
  source: "施設(知能センター)の常設照明のみ。追加の光源は置かない"
  window: "窓から遠く直射日光は入らない。効くのは昼か夜かの差だけ"
  # ⚠ 統制されていない変数。日をまたいで録るので、昼に録った回と夜に録った回で
  # 画像の明るさが変わりうる。scene 名と sha は変わらないので**この差はシーン
  # プロファイルでは検出できない**。対処は (a) 収録の時間帯を固定する
  # (b) セッションごとに昼/夜を notes.md か manifest の human_fields に記録する。
  # 現状は (b) を前提。**対照実験なので v1 と v2 で時間帯の分布を揃えるのが望ましい**
  # （v1 を全部昼・v2 を全部夜で録ると、マーカーの効果と照明の効果が混ざる）。
  daylight_controlled: false
  note: "v1 と同一環境。時間帯は未定"

# --- 対象物（v1 と同一）-----------------------------------------------------
object:
  kind: bottle
  count: 1
  description: "ペットボトル(元 いろはす)。黒のビニールテープで全周ぐるぐる巻き・蓋は緑"
  fill: "空"
  orientation: "直立固定(向きは散らさない)"
  # v1 の 50ep を録ったあとに v2 を録るので、v2 開始時のボトルは v1 開始時より凹んで
  # いる。**この変形は統制しない（2026-08-04 Kento 判断）**——同一個体を通して使い、
  # ボトルは交換しない。マーカーの効果と形状変化は原理的には混ざるが、テープ巻きの
  # 剛性がある個体なので影響は小さいとみなす。抜けではなく判断としてここに残す。
  condition: "使用済み・同一個体を継続使用。凹みは統制しない（v1 より進んだ状態で開始する）"

place_target:
  kind: bin                 # かご
  # ★再現の正本は「天板上の4点マーカー」。これでかごは一意に固定される。
  # **このマーカーは v2 でも残す**（画角に入らないので対照条件を壊さない）。
  # ⚠ 下の座標は補助。基準が基準テープ（直交2辺）と違い**対向する2面から**なので
  # 1軸ぶんしか押さえていない（120+541=661≒天板幅）。マーカーがあるので足りる。
  position: "かごの左端が、天板の一方の側面から 120mm・反対の側面から 541mm"
  position_origin: "天板の対向する2面からの距離（1軸のみ・基準テープとは別基準）"
  markers: "天板上の4点マーカーで一意に位置決め。**chest カメラの画角には入らない**"
  size_mm: "外寸 182 x 241 / 深さ 130"

# --- 散らし方: v1 と同じ 3x3。ただし中心のテープを貼らない -------------------
scatter_policy:
  mode: coarse_grid
  layout: 3x3
  cells: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  strict: false            # セル中心の座標は決めない。枠内に大まかに置く
  placement: bin_side      # かごの横のスペースに枠を取る
  # 番号の振り方は v1 と同一（台帳の object_pos を両条件で比較するため必須）。
  #
  #   奥    0  1  2 | かご
  #   中    3  4  5 |
  #   手前  6  7  8 |
  #
  numbering: "far_corner_0_to_bin_near_8"

  # ★v1 との唯一の差分: **物理的な目印を一切置かない。**
  # 3x3 の中心は v1 の基準テープと同じ座標を使い、そこを目算で取る。座標を残して
  # おくのは、v1 と v2 で散らす範囲そのものを揃えるため（範囲が動くと比較にならない）。
  reference_mark: "無し（目印を置かない）"
  reference_mark_position_mm: "225 x 382（v1 のテープと同座標。目算で中心に取る）"
  # 原点は天板の直交する2辺（v1 と同一）。
  #   225mm = OpenArm を固定している机と隣接している辺（ロボット側の辺）から
  #   382mm = その直角の横辺から
  # v2 ではここにテープを貼らないので、この座標が「目算で中心を取る根拠」になる。
  reference_mark_origin: "天板の直交2辺（ロボット側の辺から225／直角の横辺から382）"
  reference_mark_in_camera_view: false
  marking: "visual_only"
  # 代償: 中心が目算になるので、v1 よりセル位置のドリフトが大きくなる。これは
  # マーカーを外すことの本質的なコストで、対照実験の一部として受け入れる
  # （「目印が無いと再現性が落ちる」ことも測っている結果に含まれる）。

  cell_size_mm: "約 30 x 30（ペットボトル1本ぶん）"
  area_mm: "約 90 x 90（30mm ピッチの 3x3）"
  # ⚠ 散らす範囲が狭い。90mm 角なので学習は 50ep で通りやすいが、**汎化はこの
  # 9cm の窓に限られる**。
  # ⚠ セル間 30mm を目算で置くので、隣接セル同士の差は目算誤差に埋もれうる。
  # セル0の偏りの検証は、隣接比較ではなく**対角（セル0 対 セル8 側）**で見る。

  # 1セッション = 10ep = セル 0〜8 を1本ずつ + セル 0 をもう1本
  # 5セッション x 10ep = 50ep。セル 0 は計 10ep、セル 1〜8 は各 5ep（v1 と同一）
  per_session: "0,1,2,3,4,5,6,7,8 を1本ずつ + 0 をもう1本"
  session_count: 5

  intentional_imbalance:
    cell: 0
    episodes: 10           # 他セルは各 5
    purpose: "1か所だけデータ量を倍にして、その位置の精度だけ上がるかを見る"
    caveat: >
      n が小さいので傾向の観測に留める。5ep の成功率は 0/5〜5/5 の6段階しかなく、
      位置間の差を統計的に主張はできない。
      順序効果は今回は統制しない(2026-07-26 Kento 判断)。セル 0 は各セッションの
      1本目と10本目に来るので、位置の効果とセッション内の順序(冷え・疲れ)は
      分離できない。台帳に ep 順は残るので、必要になったら後から切り分ける。

distractors:
  present: false
  items: []

# --- カメラの物理位置（v1 と同一）-------------------------------------------
# 製造番号・解像度・fps は設定ダンプが持つのでここには書かない。
# 「どこに何度で付いているか」はソフトから見えないので、ここが正本。
# ★対照実験なので、v1 と v2 でカメラを動かしてはいけない。
camera_mount:
  chest:
    # 取り付けパーツの上端を、OpenArm の底板を基準に測った値（レンズ中心ではない）。
    height_mm: 500
    height_ref: "取り付けパーツの上端／OpenArm 底板からの高さ"
    # 角度は目分量だが、**公式のカメラマウントを使っているので傾きは部品で決まる**。
    # ★対照実験なので v1 からカメラを動かしてはいけない（同じマウント・同じ取り付け）。
    tilt_deg: 45           # 目分量・下向き（v1 と同一）
    mount_part: "OpenArm 公式のカメラマウント"
    view_note: >
      散らす範囲（約90mm角）とかごの両方が画角に収まる（v1 と同一・2026-08-04 確認）。
      かごの4点マーカーは画角に入らない。**ボトルの基準テープは存在しない**。
      腕は9マスすべてに届く。
