# シーンプロファイル: 北九州(九工大) タケエイ仕分け 木材 レベル1 v1 — 画角内に木材 1 個だけを置き、
# 拾って正面奥の木材用の箱へ置く — 2026-10-20 起草
#
# 方針: docs/takeei-material-level-collection.md（種類 × レベル1〜4 × 50 本）。
# 机・照明・カメラの取り付けは kitakyushu-takeei-v1（2026-10-19 実測）と同じ拠点・同じ設置を引き継ぐ。
# 変わったのは対象物（木材 1 個のみ）・置き場（正面奥の箱）・散らし方。
#
# **状態: 下書き。TODO が残っている間は本番(gate/session)を起動できない（dry は SCENE=none）。**

name: kitakyushu-wood-l1-v1
created: 2026-10-20
measured: 2026-10-20            # 箱・木材の寸法と箱の位置（Kota 実測・会話内）
task: takeei-wood-pick-place
material: wood
level: 1
note: >
  九州工業大学(北九州)の OpenArm 両腕で、画角内に木材を 1 個だけ置き、それを拾って
  ロボット正面・木材より奥に置いた木材用の箱へ入れるデータを録る（種類別 VLA の木材・レベル1）。
  他の種類のゴミは画角に入れない。kitakyushu-takeei-v1（山から何でも拾う汎化収集）とは
  タスクも置き場も違うので混ぜない。

# --- 腕の役割 -------------------------------------------------------------
arm_roles:
  left: "作業（全エピソードで使う）"
  right: "作業（全エピソードで使う）"
  assignment_rule: "全エピソードで両腕を使う（片腕を固定しない）。拾うのは基本的に木材に近い方の腕（2026-10-20 Kota決定）"
  right_hold_method: none
  right_pose_source: "config/pose_sets/kitakyushu-takeei-v2/right.yaml（前日から引き継ぎ）"

# --- 机（ロボット固定部）。kitakyushu-takeei-v1 と同じ（2026-10-19 実測） ---------
robot_base:
  mounted_on: height_adjustable_table
  table_height_mm: 900
  base_plate_tip_to_table_edge_mm: 60
  base_mount: grip
  base_mount_detail: "グリップでロボット底板を昇降デスクの縁に固定"

table:
  kind: height_adjustable
  height_mm: 900
  desk_preset: "90"
  surface: "丈夫な白いプラスチック"
  base_to_table_edge_mm: 60
  base_mount: "グリップでロボット底板を昇降デスクの縁に固定"

mat:
  present: true
  kind: "灰色のカーペット（ポリエチレン）・2026-10-20 Kota確認"
  orientation: "木材を置く範囲（450 x 310mm）に敷く。箱より手前"   # kitakyushu-takeei-v1（マットなし）との違い

lighting:
  source: "施設の常設照明のみ(変化なし・2026-10-19 Kota確認)"
  window: "窓からの採光なし(2026-10-19 Kota確認)"
  daylight_controlled: false
  daylight_recorded_at: "session layer（manifest.identity.started_local / notes.md の lighting_observed）"

# --- 対象物（木材 1 個のみ） ------------------------------------------------
object:
  kind: wood
  count: 1                      # 1 エピソードで画角内に置くのは 1 個だけ（レベル1の定義）
  description: >
    木材 3 個を使い回す（1 エピソードで画角に置くのは 1 個だけ。2026-10-20 Kota 実測）:
    (1) 立方体 1 辺 47mm、(2) 小さい円柱 直径 46mm × 高さ 98mm、
    (3) 二等辺三角柱 高さ 48mm・一辺 47mm。
    大きい円柱（直径 28mm × 高さ 398mm）は使わない（2026-10-20 Kota決定）
  pieces:
    - {id: cube, shape: cube, size_mm: "47"}
    - {id: cylinder_small, shape: cylinder, diameter_mm: 46, height_mm: 98}
    - {id: triangular_prism, shape: isosceles_triangular_prism, height_mm: 48, side_mm: 47}
  fill: solid
  orientation: "毎回ばらばら（固定しない・2026-10-20 Kota決定）"
  condition: "同じ 3 個を通しで使う（欠け・汚れが出たらセッション層の notes.md に記録）"

place_target:
  kind: box
  position: "ロボットの真正面・木材より奥（2026-10-20 Kota決定）"
  position_origin: "底板の先端から箱の手前の縁まで 380mm・左右は中央（2026-10-20 Kota 実測）"
  markers: "箱をテーブルに固定（毎回動かさない・2026-10-20 Kota）"
  size_mm: "W320 x D215 x H130"   # 横幅 × 奥行き × 高さ（2026-10-20 Kota 実測）

# --- 散らし方（木材を置く位置） -----------------------------------------------
scatter_policy:
  mode: free                    # マス目は使わず、範囲内で位置も向きも毎回ばらばら（2026-10-20 Kota決定）
  layout: "横 450mm × 奥行き 310mm の範囲・左右中央・箱より手前（2026-10-20 Kota 実測）"
  cells: []
  strict: false
  placement: "箱より手前（ロボット側）"
  numbering: "位置を番号で管理しない（free）"
  reference_mark: none
  reference_mark_position_mm: n/a
  reference_mark_origin: n/a
  reference_mark_in_camera_view: n/a
  marking: none
  cell_size_mm: n/a
  area_mm: "450 x 310"
  per_session: "gate 10本 → session 40本（合計50本・docs/takeei-material-level-collection.md）"
  session_count: 2
  intentional_imbalance: none

distractors:
  present: false                # レベル1の定義: 他の種類の物体は画角に入れない
  items: []

# --- カメラの物理位置（kitakyushu-takeei-v1 と同じ取り付け） ------------------------
camera_mount:
  chest:
    height_mm: 700
    height_ref: "OpenArm底板から、取り付けパーツ基準"
    tilt_deg: 45
    mount_part: "自作のカメラマウント(既製品ではない)"
    view_note: "上部に箱全体、下半分に木材を置く範囲（灰色のカーペット）が写る（2026-10-20 dry で確認・Kota OK）"
  wrist_left:
    mount_part: "D405用手首マウント(部品名 unknown)"
    serial: "409122272149"
    orientation: unknown
    view_note: "露出は手動(exposure=8000, gain=16)・kitakyushu-takeei-v1 と同じ"
  wrist_right:
    mount_part: "D405用手首マウント(部品名 unknown)"
    serial: "352122273417"
    orientation: unknown
    view_note: "露出は手動(exposure=8000, gain=16)・kitakyushu-takeei-v1 と同じ"
