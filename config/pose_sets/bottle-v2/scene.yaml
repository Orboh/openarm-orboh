# シーンプロファイル: ボトル pick-and-place・机上・chest 単眼
#
# このファイルは「物理配置の宣言」であって、ソフトの挙動は変えない。
# 収集スクリプトは SCENE=bottle-desk-v1 を受け取り、このファイルの sha を
# manifest.json に焼き込むだけ。だから守るルールは1つだけ:
#
#   物理配置を変えたら「新しいファイル」を作る。このファイルの中身は書き換えない。
#   (同名で中身が変わると、過去セッションが名乗る条件と実物が食い違い、
#    混ぜてよいデータかの判定ができなくなる)
#
#   ただし境界は「最初のコミット」ではなく**「最初のエピソード」**。参照している
#   セッションが0本のうちは書き換えて構わない（守るべき指し先が存在しないから）。
#   実際 2026-08-04 のテープ黒→白の変更は、1本も録る前だったのでこのファイルを
#   直接書き換えた。**録り始めた後に同じ変更をするなら v2 を新設するしかない。**
#
# 書くのは「ソフトが知り得ない物理」だけ。左右の腕・fps・カメラの製造番号・
# 解像度・重力補償値・commit・較正 sha は起動時の設定ダンプに出るので書かない。

name: bottle-desk-v1
created: 2026-07-25
measured: 2026-08-04        # 実測値を入れた日（実機の前で計測）
task: bottle-pick-and-place
note: "Kento 単独収集 50ep 用。操作者3人混在の _merged25 とは混ぜない"

# --- 経緯: マーカー有無の対照実験は中止した（2026-08-04）----------------------
# 一度は「v1=マーカー有りで 50ep → v2=マーカー無しで 50ep」の対照実験を計画したが、
# **マーカー無しでは基準が取れず収集自体が成立しない**（ボトルを置く位置を決められない）
# と Kento が判断して中止。`bottle-desk-v2.yaml` は削除した（git 履歴に残る）。
#
# 代わりに採ったのが**テープを白にして天板と同色にする**打ち手（下の scatter_policy）。
# 条件を2つ録らずに、近道学習の余地を1条件のまま下げられる。
#
# 【統制しないと決めたもの（2026-08-04 Kento 判断・v2 から移設）】
# 抜けではなく判断としてここに残す。
#   - **操作者の上達**: Kento は既に十分テレオペしてきており、50ep のあいだの学習曲線は
#     平坦とみなす。なお台帳に `ep` 順と `retakes` が残るので、**もし上達が効いていれば
#     セッションが進むほど retakes が減る形で後から検出できる**（無料で反証可能なので、
#     この仮定を置いても危険が小さい）
#   - **ボトルの凹みの進行**: 同一個体を継続使用（object.condition 参照）
#   - **昼/夜の照明差**: lighting.daylight_controlled: false 参照

# --- 机 ---------------------------------------------------------------------
# 2026-08-06 収集開始前に高さを preset 72 → 81 へ変更（Kento）。録画エピソード0本の
# 時点なので上の規約どおり本ファイルを直接更新（v2新設は不要）。ロボットとカメラは
# 机にクランプ固定＝机と一緒に上下するので、机以外の相対値（base_to_table_edge・
# camera_mount）は変わらない。画角の再確認スクショ=Dev-Log 2026-08-05 追記4。
table:
  kind: height_adjustable   # 昇降テーブル
  # 表示値 81 からの換算（表示は cm 刻みの丸めなので ±5mm・実測したら差し替え）
  height_mm: 810            # 床から天板まで
  # 昇降テーブル自身の表示値。再現するときはこれを合わせる方が実測より速く確実。
  desk_preset: "81"
  surface: "白。アルミニウム基材に粉体塗装"
  # ロボット基部の定義が曖昧なので、再現できる物理関係で書く:
  # OpenArm を固定するクランプを昇降テーブルの縁に突き当てて固定しており、
  # OpenArm 底板の先端から天板の手前端までがクランプの幅ぶんだけ空く。
  base_to_table_edge_mm: 35
  base_mount: "クランプを昇降テーブルの縁に突き当てて固定(35mm=クランプ幅)"

mat:
  present: false            # 敷かない
  kind: null
  orientation: null

lighting:
  # ここに書くのは**セッションをまたいで変わらないもの**だけ。
  source: "施設(知能センター)の常設照明のみ。追加の光源は置かない"
  window: "窓から遠く直射日光は入らない。効くのは昼か夜かの差だけ"
  #
  # ★昼/夜は**この層に書かない**（2026-08-04 Kento 指摘で設計を修正）。
  # シーンプロファイルは「一度宣言して sha で参照する静的な物理条件」のモデルで、
  # シーンを書く時刻と収録する時刻はずれる。**流動的な値をここに置くと、値として
  # 意味を持てない**（固定するなら条件ごとに別シーンが必要になり、統制しないなら
  # ここに書いても何も言えない）。
  #
  # よって昼/夜は**セッション層で記録する**（3層設計の①＝manifest）:
  #   - `manifest.json` の `identity.started_local` / `local_hour` ＝**自動**
  #     （UTC の開始時刻から導出。UTC だけでは昼夜が読めないので併記している）
  #   - `manifest.json` の `human_fields.lighting_observed` と `notes.md` の
  #     frontmatter `lighting_observed` ＝**人が昼/夜を書く**
  #   - `notes.md` の `local_hour` は dataview から引けるので、
  #     「昼のセッションだけ」を機械的に絞って結果を比較できる
  daylight_controlled: false
  daylight_recorded_at: "session layer（manifest.identity.started_local / notes.md の lighting_observed）"
  note: "シーン登録は 2026-08-04 15:30 頃。収録の時間帯は固定しない（セッション毎に記録する）"

# --- 対象物 -----------------------------------------------------------------
object:
  kind: bottle
  count: 1
  description: "ペットボトル(元 いろはす)。黒のビニールテープで全周ぐるぐる巻き・蓋は緑"
  fill: "空"
  orientation: "直立固定(向きは散らさない)"
  # ⚠ 対象物が収集中に変形する。テープ巻きの上から何度も掴んでいるので既に凹みが
  # あり、50ep のあいだ凹みは進む。つまり「同じ対象物」は厳密には成り立たない。
  # 途中で潰れて掴み方が変わるほどになったら、交換するか続けるかの判断が要る
  # (交換したら新しいシーンファイルを作る = 条件が変わったことを git に出す)。
  condition: "使用済み。テープ越しに何度か掴んでおり凹みあり(50ep 中に進行する)"

place_target:
  kind: bin                 # かご
  # ★再現の正本は「天板上の4点マーカー」。これでかごは一意に固定されるので、
  # 日をまたいでも同じ位置に戻せる。下の座標は補助的な記録。
  # ⚠ 座標の基準が基準テープ（直交2辺）と違い、**対向する2面から測った値**なので
  # 1軸ぶんしか押さえていない（120+541=661≒天板幅）。ロボット側の辺からの距離は
  # 未記録。マーカーがあるので実用上は足りるが、座標だけでは復元できない。
  position: "かごの左端が、天板の一方の側面から 120mm・反対の側面から 541mm"
  position_origin: "天板の対向する2面からの距離（1軸のみ・基準テープとは別基準）"
  markers: "天板上の4点マーカーで一意に位置決め。**chest カメラの画角には入らない**"
  size_mm: "外寸 182 x 241 / 深さ 130"

# --- 散らし方: かごの横に 3x3 の粗い枠 --------------------------------------
# 厳密な座標は定義しない。枠は「区画」であって点ではない。
scatter_policy:
  mode: coarse_grid
  layout: 3x3
  cells: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  strict: false            # セル中心の座標は決めない。枠内に大まかに置く
  placement: bin_side      # かごの横のスペースに枠を取る
  # かごと反対側かつ奥が 0、かご側かつ手前が 8。行は奥→手前、各行はかごから
  # 遠い側→かご側の順に増える(素直な読み順)。
  #
  #   奥    0  1  2 | かご
  #   中    3  4  5 |
  #   手前  6  7  8 |
  #
  # 番号の振り方自体は任意だが、決めて宣言しないと台帳の object_pos が
  # 意味を持たないので固定する。
  # 副次的な性質: 倍のデータを取る 0 は「かごから最も遠く奥」= 搬送距離が最長で
  # おそらく最も難しいセル。データ量の効果を最も見たい場所に当たっている。
  numbering: "far_corner_0_to_bin_near_8"
  # 枠9マスは物理的に描かない。**テープで固定してあるのは「ボトルを置く基準位置」
  # 1点だけ**で、それが 3x3 の中心（セル4／1から数えて5番目）。残り8マスは目算で
  # その周りに取る(2026-08-04 Kento)。よって:
  #   - 日をまたいでも中心は戻せる（テープがある）
  #   - 各セルの位置は目算なのでセッション間で多少ドリフトする
  # ★テープは**白**にして天板（白の粉体塗装）と同色にした（2026-08-04）。
  # 狙いは「人には見えて、機械には見えにくい」の分離。RGB カメラで低コントラストなら
  # 方策が手がかりとして拾いにくく、人は近くで見れば基準として使える。
  reference_mark: "白のテープで固定（3x3 の中心＝セル4）。天板と同色＝低コントラスト"
  reference_mark_color: "白（天板と同色。以前は黒だった）"
  reference_mark_position_mm: "225 x 382"
  # 原点は天板の直交する2辺。
  #   225mm = OpenArm を固定している机と隣接している辺（ロボット側の辺）から
  #   382mm = その直角の横辺から
  reference_mark_origin: "天板の直交2辺（ロボット側の辺から225／直角の横辺から382）"
  cell_size_mm: "約 30 x 30（ペットボトル1本ぶん）"
  area_mm: "約 90 x 90（30mm ピッチの 3x3）"
  # ⚠ 散らす範囲が狭い。90mm 角なので、学習は 50ep で通りやすいが**汎化はこの
  # 9cm の窓に限られる**。窓の外にボトルを置いた本番では効かないと想定しておく。
  # ⚠ セル間 30mm を目算で置くので、隣接セル同士の差は目算誤差に埋もれうる。
  # セル0の偏りの検証は、隣接比較ではなく**対角（セル0 対 セル8 側）**で見る方が
  # 誤差に強い。
  # 画角には入る（かごの4点マーカーは入らない）。ただし白なので低コントラスト。
  reference_mark_in_camera_view: true
  #
  # 【経緯と最終形】
  # 2026-07-26: 「物理マーカーを置かない＝目視のみ」と決めた。理由は、目印が画角に
  #   写ると方策がボトルではなく目印を手がかりに学習しうる（近道学習）から。
  # 2026-08-04(実機確認): 実際には基準位置1点がテープで固定済みと判明。当初は
  #   マーカー無しの 50ep と比べる対照実験を計画したが、**無しでは基準が取れず収集が
  #   成立しない**ため中止。
  # 2026-08-04(最終): **テープを黒→白に変えて天板と同色にした。** 条件を2つ録らずに
  #   近道学習の余地を下げる打ち手。
  #
  # 近道学習の risk はこれで二重に低い:
  #   (a) **テープは静止していてボトルは9箇所に動く**ので、そもそもボトルの位置情報を
  #       持たない（近道学習は手がかりが対象の位置と相関するときに起きる）
  #   (b) 白なので画像上のコントラストが低い
  # ただしゼロではない: 粉体塗装とビニールテープでは光沢と質感が違い、照明下で差が
  # 出うる。**残留 risk として認識しておく**（データが録れたら 動画で見え方を確認する）。
  #
  # 副次的な性質: ボトルは黒テープ巻き・天板は白・目印も白 ＝ **画像内で高コントラスト
  # なのは対象物だけ**という構造になり、知覚には素直に有利。
  #
  # 推論時の扱い: 収集時と一致させるのが原則（貼っておく）。ただし低コントラストに
  # した分、貼り忘れで崩れる度合いは小さくなった＝収集と推論の結合が弱まった。
  marking: "tape_reference_low_contrast"

  # 1セッション = 10ep = セル 0〜8 を1本ずつ + セル 0 をもう1本
  # 5セッション x 10ep = 50ep。セル 0 は計 10ep、セル 1〜8 は各 5ep
  per_session: "0,1,2,3,4,5,6,7,8 を1本ずつ + 0 をもう1本"
  session_count: 5

  # この偏りは意図的なもので、不統制ではない
  intentional_imbalance:
    cell: 0
    episodes: 10           # 他セルは各 5
    purpose: "1か所だけデータ量を倍にして、その位置の精度だけ上がるかを見る"
    caveat: >
      n が小さいので傾向の観測に留める。5ep の成功率は 0/5〜5/5 の6段階しかなく、
      位置間の差を統計的に主張はできない。
      順序効果は今回は統制しない(2026-07-26 Kento 判断)。セル 0 は各セッションの
      1本目と10本目に来るので、位置の効果とセッション内の順序(冷え・疲れ)は
      分離できない。台帳に ep 順は残るので、必要になったら後から切り分ける。

distractors:
  present: false
  items: []

# --- カメラの物理位置 -------------------------------------------------------
# 製造番号・解像度・fps は設定ダンプが持つのでここには書かない。
# 「どこに何度で付いているか」はソフトから見えないので、ここが正本。
camera_mount:
  chest:
    # 取り付けパーツの上端を、OpenArm の底板を基準に測った値（レンズ中心ではない）。
    height_mm: 500
    height_ref: "取り付けパーツの上端／OpenArm 底板からの高さ"
    # 角度は目分量だが、**公式のカメラマウントを使っているので傾きは部品で決まる**。
    # 再現するときは角度を合わせ込むより同じマウントを使う方が確実（実質的な再現キー）。
    tilt_deg: 45           # 目分量・下向き
    mount_part: "OpenArm 公式のカメラマウント"
    view_note: >
      散らす範囲（約90mm角）とかごの両方が画角に収まることを実機で確認（2026-08-04）。
      かごの4点マーカーは画角に入らない。ボトルの基準テープは画角に入る。
      腕は9マスすべてに届く。
      机 preset 81 への変更後も同様に収まることを stream_chest.py のライブ映像で
      再確認（2026-08-06・スクショ=orboh-company-vault Dev-Log
      2026-08-06-bottle-v2-camera-framing.png）。
