# シーンプロファイル: ビニールテープ pick-and-place・机上・chest+wrist
#
# このファイルは「物理配置の宣言」であって、ソフトの挙動は変えない。
# 収集スクリプトは SCENE=tape-desk-v1 を受け取り、このファイルの sha を
# manifest.json に焼き込むだけ。だから守るルールは1つだけ:
#
#   物理配置を変えたら「新しいファイル」を作る。このファイルの中身は書き換えない。
#   ただし境界は「最初のエピソード」。0本のうちは書き換えてよい。
#
# 2026-09-05 作成。bottle-desk-v1 とは別タスク・別カメラ構成(chest+wrist)のため新設。

