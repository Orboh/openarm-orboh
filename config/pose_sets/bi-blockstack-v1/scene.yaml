# 板橋 両腕（3 眼）積み木シーン v1 —— 2026-09-22 起草・同日 16:0x に Kento の実測で確定（Claude 記入）
#
# 物理配置の宣言。ソフトの挙動は変えない。SCENE=itabashi-blockstack-v1 で収集を起動すると
# このファイルの sha が manifest.json に焼かれる。**1 本でも録った後は書き換えず -v2 を作る。**
# 未測の項目は TODO でなく unknown / deferred_to_v2 と書いてある（record の TODO ガードは通す。
# 値が決まったら v2 で埋める。積み木の寸法と色、積む位置、カメラ部品名が該当）。
# 設定ダンプに出るもの（腕・fps・カメラ製造番号・解像度・重力補償・commit・較正 sha）はここに書かない。

name: itabashi-blockstack-v1
created: 2026-09-22
measured: 2026-09-22       # Kento の実測（巻き尺・目視）。unknown の項目は v2 で埋める
task: blockstack           # TASK="Stack the wooden blocks using both arms"
note: >
  板橋の OpenArm 両腕（chest D435i + 左右 wrist D405 の 3 眼）で「両腕で積み木を積む」を録る。
  1 エピソード = 円筒を土台に、その上に四角（立方体）、その上に三角柱を載せる（3 個・順序固定）。
  積み木の置き場所（拾う位置）は固定、散らしなし、妨害物なし。積む位置は Kento が後で確定（v2）。
  収集者 Kento。較正フレームは 2026-09-21〜22 の bump-to-stop 版（左 leader は 09-22 11:42 の 3 回目）で、
  開始姿勢は 2026-09-22 15:5x に J7 を両腕 0.0 にした版。08-04 右フレームで録った bottle v2 / tape v1 とは混ぜない
  （判別は manifest の較正 sha と開始姿勢 sha）。

# --- 机（2 台構成: ロボットの台と、対象物の作業台） ---------------------------
robot_base:
  mounted_on: fixed_table          # OpenArm の底板は固定机に固定
  table_height_mm: 720             # 床から天板まで
  base_plate_tip_to_table_edge_mm: 30   # 底板の先端から天板の縁まで（Kento 実測）
  base_mount: fixed                # 固定方法の種別（クランプ／ボルト）は unknown
  base_mount_detail: unknown

table:                             # 対象物を置く作業台（積み木の作業面）
  kind: height_adjustable
  height_mm: 960                   # 床から天板まで（昇降テーブル・Kento 実測）
  desk_preset: unknown             # 昇降のメモリ値は未記録
  surface: unknown                 # 天板の材質と色は未記録（v2）
  relation_to_robot: "OpenArm の固定机（720 mm）の前に昇降テーブル（960 mm）を置く。作業面はロボット底板より 240 mm 高い"

mat:
  present: false                   # 天板に敷物なし（2026-09-22 Kento 回答なし＝無しとして記録。違えば v2）
  kind: null
  orientation: null

lighting:
  source: "板橋オフィスの常設天井照明のみ（暖色）。追加光源なし"
  window: unknown                  # 窓の有無・直射日光は未記録
  daylight_controlled: false
  daylight_recorded_at: "session layer（manifest.identity.started_local / notes.md の lighting_observed）"
  note: "gate は 2026-09-22 16 時ごろに収録"

# --- 対象物 -----------------------------------------------------------------
object:
  kind: wooden_block
  count: 3                         # 1 エピソードで積む個数
  shapes: [cylinder, cube, triangular_prism]   # 積む順（下から）
  description: "円筒（土台）、四角（立方体）、三角柱（頂上）の木製積み木 3 個。1 辺の mm・色・表面（塗装／無垢）は未計測（v2）"
  fill: solid                      # 中身なし（無垢材）
  orientation: fixed               # 拾う位置と向きは固定
  condition: 劣化しない前提・同一セットで通す（欠け／汚れが出たら notes.md）

place_target:
  kind: fixed_spot                 # 積む場所は 1 か所固定
  position: deferred_to_v2         # 机の直交 2 辺からの mm（Kento が後で確定）
  position_origin: deferred_to_v2
  markers: unknown                 # 目印の有無
  size_mm: unknown

# --- 散らし方 ---------------------------------------------------------------
scatter_policy:
  mode: fixed                      # 散らさない（拾う位置は形ごとに固定）
  layout: "形ごとに 1 か所（円筒・立方体・三角柱）"
  cells: 1
  strict: true
  placement: unknown               # 左腕側／右腕側のどちらで拾うかは未記録（v2）
  numbering: n/a
  reference_mark: none
  reference_mark_position_mm: n/a
  reference_mark_origin: n/a
  reference_mark_in_camera_view: n/a
  marking: visual_only
  cell_size_mm: n/a
  area_mm: n/a
  per_session: "gate 10 本、以後 1 セッション 10 本"
  session_count: "未計画（2026-09-30 の AWS 枠までに録れるだけ）"
  intentional_imbalance: none

distractors:
  present: false
  items: []

# --- カメラの物理位置 -------------------------------------------------------
camera_mount:
  chest:
    height_mm: 650
    height_ref: "OpenArm の台（底板）からの高さ（Kento 実測。レンズ中心か取り付け部かは未区別）"
    tilt_deg: unknown              # 下向き・角度は目分量でも未記録
    mount_part: unknown
    view_note: "拾う位置と積む位置が画角に入ることをモニターのプレビューで確認する運用（v1 では未記録）"
  wrist_right:
    mount_part: "D405 用手首マウント（部品名 unknown）"
    orientation: unknown           # 指先が写るか未確認
    view_note: unknown
  wrist_left:
    mount_part: "D405 用手首マウント（部品名 unknown）"
    orientation: unknown
    view_note: unknown
