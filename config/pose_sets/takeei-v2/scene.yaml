# 板橋 タケエイ仕分け v1 — 両腕とも作業して 4 品目を机の上の区画 4 か所へ連続仕分け（位置と並びは決め打ち・右腕のカメラ役固定は必要時の選択肢）—— 2026-10-02 起草・2026-10-04 区画と決め打ちに改稿（Claude・下書き）
#
# 計画の正本: orboh-company-vault 05PoC-Demo/PoC-Mizuho-Leasing/2609-11-GENIAC-Takeei/261007-to-TakeeiMTG/takeei-geniac-dev-plan-20261002.md（§2・§3・§4・§11）
# 書式の手本: scenes/itabashi-blockstack-v1.yaml（両腕作業の先行シーン）。右腕のカメラ役固定を採るときの手本は
#   scenes/itabashi-blockstack-leftarm-rightcam-v1.yaml（右腕カメラ役・左腕単独の先行シーン）
#
# **状態: 下書き（未 commit・Thor 未適用）。** 収集初日の朝に実機の前で TODO を実測値で埋め、Kento の承認を得て
# commit し Thor へ適用する。収集スクリプトは TODO が 1 件でも残ると本番（gate / session）を拒否する
# （dry は SCENE=none なので影響しない）。
#
# 2026-10-04 の改稿で変えたこと（Kento 決定 2026-10-03 に合わせた）:
#   - 置き場を浅トレイ 3 個から「机の上の区画 3 か所」に変えた（place_target）。
#   - 位置の散らし（配置カード C01〜C12・向き ±30°）をやめ、開始スロット 3 か所に品目の並びも含めて決め打ちした（scatter_policy）。
#     位置と向きを散らすのは段階 B（MR4-C-002）で、そのときは新シーンと新しい開始姿勢セットを切る。
#   - シートの形を毎回変える案から、1 種類にそろえる案に変えた（§11 の Kento 判断待ち）。
#   トレイ前提の旧下書きは git に入っていない（未 commit のまま改稿した）。
#
# 凍結ルール（重要）:
#   開始姿勢セット takeei-v2 は最初の本番収集（ゲート 10 本）で自動凍結され、そのとき scene_sha が保存される。
#   凍結後にこのファイルを 1 文字でも変えると pose_set.py check の sha 検査で収集も推論も止まる。
#   だから 10/7 の重なり方（下の overlap）は、凍結前の今のうちに書いておく。段階 B の重なりの型はこのファイルに書かない
#   （段階 B は位置を散らし北九州へも移すので、新しいシーンファイルで定義する・計画 takeei-geniac-dev-plan-20261002 §3「10/7 の重なり方とシーン YAML」）。
#   北九州へ移したら、このファイルは書き換えず、北九州の実測値で scenes/kitakyushu-takeei-v1.yaml を新しく作り、
#   pose_set.py new <新名> --from takeei-v2 --scene kitakyushu-takeei-v1 で新セットを切る（Kento 決定 2026-10-04・計画 §2.13）。
#   このファイルの重なり方は 1 通りだけなので、収集のたびに条件を選ぶことは無い（env SCENE_CONDITION の口も無い）。
#   変える必要が出たら pose_set.py new <新名> --from takeei-v2 --scene <新シーン> で新セットを切る。
#
# 値の書き分け:
#   TODO     = 収集初日の実測、または計画 §11 の Kento の判断で埋める。凍結前に 0 件にする（0 件になるまで本番は起動しない）。
#              判断待ちの行はコメントに「§11」と書いた。
#   deferred = 収集初日には埋められない（右腕のカメラ役固定を採ったときだけ要る値など）。TODO と書くと本番が止まるので
#              deferred と書いて凍結する（先行シーンの unknown / deferred と同じ流儀）。
#   unknown  = 計画にも既存ノートにも値が無く、実測の予定も無い。

name: itabashi-takeei-v1
created: 2026-10-02
measured: "2026-10-05 夜〜10-06 0 時台（Kento の回答と、テレオペの開始姿勢での 3 眼の撮影）"
task: takeei-sort           # TASK_SLUG は takeei_sort（env 側）。dataset 案 Orboh/bi_openarm_takeei_sort_chest_wristr_wristl_v1（§11）
note: >
  板橋の OpenArm 両腕（chest D435i + 左右 wrist D405 の 3 眼）で「両腕とも作業して 4 品目（2x4 材・白い角棒〔アイボリー角棒〕・
  ブルーシート・ゴミ袋）を固定順で置き先（ゴミ袋と 2x4 は机の左の端、白い角棒とシートは机の右の外へ落とす）へ移す」を録る。1 エピソード = 決め打ちの重なりで置いた
  4 品目を、固定順（ゴミ袋、2x4、白い角棒、ブルーシート・計画 §2.19）で各置き先へ移し、最後に開始姿勢へ戻って 3〜5 秒静止して終わる。
  開始スロットの位置と品目の並びは 1 通りに決め打ちする（M4 段階 A・案 α。Kento 決定 2026-10-03）。
  右腕は固定しない（2026-10-02 Kento 訂正: 右腕のカメラ役固定は決定でなく、必要と判断したときに採る選択肢）。
  10/7 の本番収集は、重なり方も 1 通りに決め打ちした「重なった状態から回収する」デモで、Kento 単独（下の overlap・
  Kento 決定 2026-10-04）。重なりを見て解く力は持たない。段階 B（位置と重なりを散らす）と北九州での収集は、このシーンは使わず新しいシーンファイルを切る。
  タスク文は 10/7 の収集の中で 1 本に固定する。段階 B 以降に同じ文を使うかは決めていない（計画 §2.5）。
  blockstack 系のシーン（itabashi-blockstack-*）とはタスクも置き場も違うので混ぜない。

# --- 腕の役割（両腕とも作業する。右腕のカメラ役固定は選択肢） ------------------------
arm_roles:
  left: "作業。運ぶ品目は下の object.items.*.carrying_arm"
  right: "作業。固定しない。開始姿勢は takeei-v2 の right.yaml（左右とも開始姿勢と経由地あり）"
  assignment_rule: "品目ごとに決め打ち（計画 §2.19・Kento 決定 2026-10-05）。ゴミ袋と 2x4 は左手、白い角棒とブルーシートは右手（2026-10-05 夜）。全エピソードで同じ腕"
  right_hold_method: none           # 既定は両腕作業で FREEZE_SIDE は使わない。右腕のカメラ役固定を採ったときだけ program_hold（env FREEZE_SIDE=right）
  right_pose_source: "config/pose_sets/takeei-v2/right.yaml（正本・経由地つき。両腕作業では開始姿勢、右腕固定を採ったときは固定姿勢）"
  right_pose_deg: [-53.07, -0.68, 0.34, 132.21, -23.63, 12.61, 8.45]   # logical [deg]・J1..J7。takeei-v2 の right.yaml（2026-10-02 11:36 撮影）の最終姿勢
  right_gripper_deg: deferred   # 右腕固定を採ったときだけ要る（固定中の gripper 位置）。leftarm v1 は -65（全開）。takeei-v2 の right.yaml は gripper 0.0（較正ゼロ）で、固定中の値は FROZEN_GRIPPER_DEG で与える。採るときに決める
  right_view_note: >
    収集初日のプレビューで、右 wrist カメラが開始姿勢で区画を 1 つ以上写すかを見る。
    写らなくても撮り直さず「写っているもの」として学習させる（計画 §3・§11）。写り方を実測して書く。
    実測: gripper の指の間に、シート・2x4・ベニヤ・白い角棒が写る（机の右側を見下ろす）（2026-10-06 00:28 にテレオペの開始姿勢で撮影。takeei-20261006-start-pose-*.jpg）
  rationale: >
    右腕のカメラ役固定は決定でなく、Kento が必要と判断したときに採る選択肢（計画 §5 の逃げ道 (c)）。判断材料は板橋の実績で、
    両腕で動かした bi-blockstack v1（50 本）は 10 本とも L2 止まり、右腕固定・左腕単独の leftarm v1（50 本）は R1 で L3。
    判断できる時点は収集初日の受入ゲート後と、翌日の R1 判定。採った場合は右腕の行動が定数になりデータの性質が変わるので、
    それ以前の両腕データと混ぜず、データセットの repo を分ける。FREEZE_SIDE=right と FROZEN_GRIPPER_DEG などの設定はそのときに入れる。
    「右腕固定でケーブル脱落の条件が消える」とは書かない。右手首ケーブルは収集初日の朝にケーブルタイで留め、
    整列 10 サイクルの耐久試験に合格するまで収集に入らない。

# --- 机 ---------------------------------------------------------------------
robot_base:
  mounted_on: fixed_table
  table_height_mm: 720          # 2026-10-05 夜 Kento 実測。OpenArm 側の固定机。blockstack 系では 720。収集初日に再実測
  base_plate_tip_to_table_edge_mm: 30    # 2026-10-05 夜 Kento 実測。 blockstack 系では 30。収集初日に再実測
  base_mount: fixed
  base_mount_detail: unknown

table:
  kind: height_adjustable
  height_mm: 1080               # 2026-10-05 夜 Kento: 表示 108 のまま（約 1080 mm。巻き尺の実測ではなく表示値）。床から天板まで。2026-10-01 に表示 96（960 mm）から表示 108（約 1080 mm）へ変更した（dev-log 2026-10-01）
  desk_preset: 108              # 昇降テーブルの表示値。再現するときは表示を合わせる方が測り直すより速い
  surface: "白い昇降テーブルの上にベニヤを敷く（ベージュ〜明るい茶）"   # 2026-10-05 夜 Kento 確認。天板の材質と色（ベニヤ。木材と同色の恐れがある・計画 §10）
  relation_to_robot: "作業面はロボット側の固定机（720）より約 360 mm 高い（1080 − 720・表示値からの計算）。ロボットの底板の先端から作業机の縁まで 30 mm"   # 2026-10-05 夜

mat:
  present: false                # 2026-10-05 夜 Kento: 敷かない（胸カメラで 2x4 とベニヤの境目は見える。ベニヤは作業で動くが受け入れる）。開始スロットの灰色マットの有無。収集初日に 1 回だけ決め、以後変えない（§11）。胸カメラで 2x4 とベニヤの境目が見えなければ開始スロットにだけ敷く
  kind: null                    # 敷かないので null
  orientation: null
  zone_mat:
    present: false              # 区画は場所だけで決め、色マットなどの表示は用意しない（Kento 決定 2026-10-04・計画 §2.6）
    note: "色は区画ごとに違う。木材の茶・作業面のベージュ・青と被らない色（赤・緑・黒など）。区画別の色は下の place_target"

lighting:
  source: "板橋の常設照明のみ（追加の光源なし）"   # 2026-10-05 夜 Kento 確認。板橋の常設照明のみか、追加光源があるか（実測・確認）
  window: "窓の光が机に入る。夜の収集では無視できる。昼に録るときは窓を段ボールで塞ぐ（Kento 2026-10-05 夜）"
  daylight_controlled: false
  daylight_recorded_at: "session layer（manifest.identity.started_local / notes.md の lighting_observed）"
  note: "照明 2 条件は 10/7 の後の追加収集で散らす。10/7 までの本番は板橋の常設照明。昼夜はここに書かない"

