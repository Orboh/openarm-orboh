      color: none
      size_mm: "n/a（机の外・落とした先の位置は問わない）"
      position_mm: "机の右の縁の外（マットレスの上）"
    sheet:
      where: "机の右の外へ落とす（下にマットレス）"   # 置き先（L3 の判定・Kento 決定 2026-10-05・夕に「落とす」とはっきりさせた・計画 §2.19）
      color: none
      size_mm: "n/a（机の外・落とした先の位置は問わない）"
      position_mm: "机の右の縁の外（マットレスの上）"
    garbage_bag:
      where: "左後方（左腕でどける）"   # 置き先（L3 の判定・Kento 決定 2026-10-05 夜・計画 §2.19。昼は「左の端」）
      color: none
      size_mm: "定めない（大まか・Kento 2026-10-05 夜）"
      position_mm: "机の左後方（大まか）"
  position_origin: "n/a（位置は mm で測らず、開始の配置の写真と大まかな方向で決める・Kento 2026-10-05 夜）"
  fixing: "印は置かず、場所だけで決める（Kento 決定 2026-10-04。本番は G1 が作業場を歩いて別の場所へ持っていく形で DimOS などとの連携として設計し、机の上の区画に色で仕分ける形は設計しないので、10/7 の区画はデモのための仮の置き場）。胸カメラに写り、置く腕の手首カメラにも写る場所に取る"
  markers: none                 # 区画の印は置かない。操作者が位置をそろえる目印を置くなら画角の外に置く
  out_of_zone_rule: "置き先の範囲は問わない（区画は大まかで意味をなさない・Kento 2026-10-05 夜）。品目がシートの上から外れ、決めた方向（ゴミ袋と 2x4 は左側、白い角棒とシートは机の右の外）へ移っていれば L3。机の上でシートに載ったまま、または逆の方向へ動いたら L3 にしない（Claude の言い換え）"
  visible_in_chest: "開始の配置（畳んだシート・その上の 2x4 とゴミ袋）は写る。白い角棒は上端にわずかで、はっきり写らない。左側の置き先はほぼ画角の外、机の右の縁は右端に少し写る（2026-10-06 00:28 にテレオペの開始姿勢で撮影。takeei-20261006-start-pose-*.jpg）"
  visible_in_left_wrist: "ゴミ袋のビニールがレンズのすぐ前にあり、ほとんど見えない（開始姿勢の左手首がゴミ袋に近い）（2026-10-06 00:28 にテレオペの開始姿勢で撮影。takeei-20261006-start-pose-*.jpg）"
  visible_in_right_wrist: "gripper の指の間に、シート・2x4・ベニヤ・白い角棒が写る（机の右側を見下ろす）（2026-10-06 00:28 にテレオペの開始姿勢で撮影。takeei-20261006-start-pose-*.jpg）"

# --- 散らし方（10/7 は決め打ち。4 品目の開始の位置） ---------------------------
scatter_policy:
  mode: fixed                   # 位置も品目の並びも 1 通りに決め打ち（Kento 決定 2026-10-03・案 α）。配置カード C01〜C12 は使わない
  layout: "4 品目を、決まった位置・並び・重なり方で置く（重なり方は下の overlap）"
  strict: true
  start_slots_mm:               # §11 の配置で決め、収集初日に実測して埋める
    lumber_2x4: "開始の配置の写真のとおり（大まか・Kento 2026-10-05 夜）"            # スロットの位置（position_origin から）と、品目の置き向き
    white_bar: "開始の配置の写真のとおり（大まか・Kento 2026-10-05 夜）"
    blue_sheet: "開始の配置の写真のとおり（大まか・Kento 2026-10-05 夜）"
    garbage_bag: "開始の配置の写真のとおり（大まか・Kento 2026-10-05 夜）"
  slot_tolerance_mm: "今回は定めない（Kento 2026-10-05 夜）"
  orientation_policy: "向きは固定。2x4 は縁を立てる向き（または実測で決めた向き）、白い角棒は実測で決めた向き。散らさない"
  numbering: "スロットは品目名で呼ぶ（番号は振らない）。台帳の object_pos は fixed と書く"
  reference_mark: none
  reference_mark_position_mm: n/a
  reference_mark_origin: n/a
  reference_mark_in_camera_view: n/a
  marking: none                 # テープや目印は置かない（Kento 2026-10-05 夜）
  collection_cards: "使わない（段階 B で位置と向きを散らすときに新シーンで使う。カードは takeei-sort-v1-approvals-and-drafts-20261002.md の (4)）"
  per_session: "gate 10 本、以後 1 セッション 10 本（初日の目標 50 本・R1 の結果しだいで 20〜30 本追加・合計 90 本以内）"
  intentional_imbalance: none

